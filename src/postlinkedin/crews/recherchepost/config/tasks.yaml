research_task_post:
  description: >
    Analyse le sujet suivant pour créer un post LinkedIn performant :

    {topic}

    Fournis les éléments essentiels :
    - tendances principales
    - informations clés
    - idées de contenu LinkedIn
  expected_output: >
    1. Résumé du sujet
    2. Tendances principales
    3. Points clés exploitables
    4. Idées de posts LinkedIn (hooks + angles)
    5. Audience cible
  agent: researcherPost